apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smart-developer-binding
  namespace: smart
subjects:
  - kind: User
    name: smart_developer
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: smart-edit
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: client-admin-binding
  namespace: smart
subjects:
  - kind: ServiceAccount
    name: client-admin
    namespace: smart
roleRef:
  kind: Role
  name: client-admin
  apiGroup: rbac.authorization.k8s.io